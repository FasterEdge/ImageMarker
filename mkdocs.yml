# 项目信息
site_name: 图像标注工具（ImageMarker）
site_url: https://skalskip.github.io/make-sense
site_author: Piotr Skalski
site_description: >-
  免费在线的照片标注工具

# 仓库
repo_name: 'SkalskiP/make-sense'
repo_url: 'https://github.com/SkalskiP/make-sense'
edit_uri: ""

# 版权信息
copyright: Copyright &copy; 2019 Piotr Skalski

# 自定义
extra:
  version: 1.11.0-alpha
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SkalskiP
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/PiotrSkalski92
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/piotr-skalski-36b5b4122/

# 页面树
nav:
  - 首页: index.md
  - 导入: import.md
  - 导出: export.md
  - 快捷键: shortcuts.md
  - 本地搭建: local-setup.md

# 配置
theme:
  name: 'material'
  palette:
    primary: 'black'
    accent: 'indigo'
  font:
    text: Roboto
    code: Roboto Mono
  logo: 'img/logo.png'
  favicon: 'img/favicon.png'
  features:
    - navigation.expand
  icon:
    repo: fontawesome/brands/github
    
# Google Analytics
google_analytics:
  - 'UA-155837750-2'
  - 'auto'

# 扩展
markdown_extensions:
  - attr_list
  - def_list
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences